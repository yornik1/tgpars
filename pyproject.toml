[project]
name = "tgpars"
version = "0.1.0"
description = "Collect messages from closed Telegram crypto-signal groups and detect manipulation (deleted/edited posts, fake winrate)."
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Price verification (Phase 3). No LLM API dependency by design: analysis is
# done by an in-session LLM agent (Claude Code / Codex) reading the exporter
# output, not by a paid per-token API call from inside the app.
analysis = [
    "ccxt>=4.3",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[project.scripts]
tgpars-login = "tgpars.scripts.login:main"
tgpars-collect = "tgpars.collector.daemon:main"
tgpars-backfill = "tgpars.scripts.backfill:main"
tgpars-export = "tgpars.analysis.export:main"
tgpars-score = "tgpars.analysis.metrics:main"
tgpars-verify-batch = "tgpars.analysis.verify_batch:main"
tgpars-verify-bots = "tgpars.analysis.verify_bots:main"
tgpars-explain = "tgpars.analysis.explain:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
